"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci && npm run build:cli"
run_mode = "concurrent"

[scripts.run.demo]
available_in = [ "local" ]
command = "npm run dev -- --port $CONDUCTOR_PORT --strictPort"
default = true
icon = "play"

[scripts.run.test]
command = "npm run test:watch"
icon = "test-tube"
